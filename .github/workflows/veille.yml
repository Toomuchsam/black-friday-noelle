name: Veille Black Friday de Noelle
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - recherche.py
      - index.html
      - noel.png
      - veille-chatgpt.json
      - .github/workflows/veille.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: veille-noelle
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Rechercher les offres
        if: github.event_name != 'push' || contains(github.event.head_commit.message, 'V4.3')
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          python -m py_compile recherche.py
          python recherche.py

      - name: Enregistrer les donnees
        if: always() && (github.event_name != 'push' || contains(github.event.head_commit.message, 'V4.3'))
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offres.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualisation de la veille'
            git push
          fi

      - name: Préparer le site
        if: always()
        run: |
          mkdir -p _site
          cp index.html offres.json veille-chatgpt.json _site/
          if [ -f noel.png ]; then cp noel.png _site/; fi
      - uses: actions/configure-pages@v5
        if: always()
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: _site

  deploy:
    needs: veille
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
